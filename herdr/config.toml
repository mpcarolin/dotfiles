# herdr configuration — symlinked to ~/.config/herdr/config.toml by install.sh.
#
# Only the single file is linked, never the parent directory: ~/.config/herdr/
# also holds live sockets, logs, and session.json, which must not enter git.
onboarding = false

[theme]
name = "terminal"
auto_switch = false

[keys]
# ctrl+alt: alt+shift+h/j/k/l belong to rift (move_node); ctrl+alt is free in rift, Hammerspoon, and Ghostty
next_tab = "ctrl+alt+l"
previous_tab = "ctrl+alt+h"
next_workspace = "ctrl+alt+j"
previous_workspace = "ctrl+alt+k"
# Moved off prefix+e / prefix+o so herdr-nvim can use them (see below).
edit_scrollback = "prefix+shift+e"
open_notification_target = "prefix+f"

[ui]
sidebar_collapsed_mode = "hidden"  # default is "compact"
hide_tab_bar_when_single_tab = true
# herdr-auto-title (kryptamine/herdr-auto-title) names tabs itself; a name typed
# at this prompt counts as manual and opts the tab out of auto-naming.
prompt_new_tab_name = false

# herdr-nvim (ChmaraX/herdr-nvim). These take over the default edit_scrollback
# (prefix+e) and open_notification_target (prefix+o) keys, which are moved in [keys] above.
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[experimental]
kitty_graphics = true
